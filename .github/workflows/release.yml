name: Test Foundry v13 module
on:
  push:
    branches: [foundry-v13]
  pull_request:
    branches: [foundry-v13]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/main.js
      - run: node --test tests/*.test.mjs
