name: Test and publish Averis Affinity Manager
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'styles/**'
      - 'assets/**'
      - 'tests/**'
      - 'module.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and regression tests
        run: |
          set -euo pipefail
          node --check scripts/main.js
          node --check scripts/catalog.mjs
          node --check scripts/activities.mjs
          node --check scripts/sheet-integration.mjs
          node --check scripts/engine.mjs
          node --check scripts/redact.mjs
          node --check scripts/features.mjs
          node --check scripts/feature-icons.mjs
          node --test tests/*.test.mjs
      - name: Validate manifest and package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m=json.load(open('module.json'))
          assert m['id']=='averis-affinity-manager'
          assert m['compatibility']['minimum']=='14.367'
          assert m['relationships']['systems'][0]['compatibility']['minimum']=='6.0.6'
          assert m['relationships']['systems'][0]['compatibility']['maximum']=='6.0.6'
          v=m['version']
          assert m['manifest']=='https://raw.githubusercontent.com/Daikaze/Averis-Affinity-Manager/main/module.json'
          assert m['download']==f'https://github.com/Daikaze/Averis-Affinity-Manager/releases/download/affinity-v{v}/averis-affinity-manager-v{v}.zip'
          PY
          VERSION=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          echo "AAM_VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -q -r "averis-affinity-manager-v${VERSION}.zip" module.json scripts styles assets README.md START_HERE_BG.md
          unzip -t "averis-affinity-manager-v${VERSION}.zip"
          test "$(find assets/affinity-icons -type f -name '*.svg' | wc -l)" -eq 65
      - name: Publish versioned Affinity Manager release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="affinity-v${AAM_VERSION}"
          ZIP="averis-affinity-manager-v${AAM_VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "$ZIP" --title "Averis Affinity Manager v${AAM_VERSION}" --notes "Playtest for Foundry 14.367+ / D&D 5e 6.0.6. GM-only UI DC, 65 canonical abilities, teacher mastery, usage tracking, and safe progression." --latest